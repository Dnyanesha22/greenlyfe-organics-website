<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenlyfe Organics – Price Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #2d6a4f;
    --green-light: #52b788;
    --cream: #f8f4ec;
    --text: #1b2e22;
    --border: #d8e8d2;
    --error: #c0392b;
    --success: #27ae60;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--green);
    letter-spacing: -0.5px;
  }

  header p {
    color: #5a7a62;
    font-size: 0.9rem;
    margin-top: 0.3rem;
  }

  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
    max-width: 560px;
    margin: 0 auto 1.5rem;
    box-shadow: 0 2px 12px rgba(45,106,79,0.07);
  }

  .card h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .card h2::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--green-light);
    border-radius: 50%;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: #3a5a40;
    margin-bottom: 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    padding: 0.65rem 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: 'DM Sans', sans-serif;
    background: #fafcfa;
    color: var(--text);
    transition: border-color 0.2s;
    margin-bottom: 1rem;
  }

  input:focus {
    outline: none;
    border-color: var(--green-light);
    background: white;
  }

  .price-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
    align-items: end;
  }

  .price-row input { margin-bottom: 0; }

  .price-row .item-label {
    font-size: 0.78rem;
  }

  .add-btn, .remove-btn {
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 0.5rem;
    cursor: pointer;
    font-size: 0.85rem;
    color: #5a7a62;
    width: 100%;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }

  .add-btn:hover { border-color: var(--green-light); color: var(--green); }

  .remove-btn {
    border: none;
    color: #c0392b;
    font-size: 0.75rem;
    width: auto;
    padding: 0.3rem 0.5rem;
    margin-top: 0;
    align-self: center;
  }

  .remove-btn:hover { background: #fdecea; border-radius: 6px; }

  .price-row-4 {
    grid-template-columns: 2fr 1fr 1fr auto;
  }

  .save-btn {
    width: 100%;
    padding: 0.85rem;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }

  .save-btn:hover { background: #1f4f3a; }
  .save-btn:active { transform: scale(0.98); }
  .save-btn:disabled { background: #aac4b5; cursor: not-allowed; }

  .status {
    max-width: 560px;
    margin: 0 auto;
    padding: 0.8rem 1rem;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 500;
    display: none;
  }

  .status.success { background: #eafaf1; color: var(--success); border: 1px solid #a9dfbf; display: block; }
  .status.error { background: #fdecea; color: var(--error); border: 1px solid #f5b7b1; display: block; }

  .help {
    max-width: 560px;
    margin: 1.5rem auto 0;
    font-size: 0.82rem;
    color: #7a9a80;
    line-height: 1.6;
  }

  .help a { color: var(--green); }

  #setup-section { display: block; }
  #prices-section { display: none; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>🌿 Greenlyfe Organics</h1>
  <p>Daily Price Manager</p>
</header>

<!-- STEP 1: GitHub Config -->
<div class="card" id="setup-section">
  <h2>GitHub Setup</h2>

  <label for="gh-token">GitHub Personal Access Token</label>
  <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">

  <label for="gh-repo">Repository (owner/repo)</label>
  <input type="text" id="gh-repo" placeholder="e.g. johndoe/greenlyfe-website">

  <label for="gh-file">Path to prices.json in repo</label>
  <input type="text" id="gh-file" placeholder="prices.json" value="prices.json">

  <button class="save-btn" onclick="loadPrices()">🔓 Load Current Prices</button>
</div>

<!-- STEP 2: Edit Prices -->
<div class="card" id="prices-section">
  <h2>Edit Today's Prices</h2>
  <div id="price-list"></div>
  <button class="add-btn" onclick="addItem()">+ Add new item</button>
</div>

<div style="max-width:560px;margin:0 auto;">
  <button class="save-btn" id="publish-btn" onclick="savePrices()" style="display:none">
    💾 Save &amp; Publish Prices
  </button>
</div>

<div class="status" id="status-msg"></div>

<div class="help">
  <strong>How to get a GitHub Token:</strong><br>
  Go to <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a>
  → Generate new token (classic) → check <code>repo</code> scope → copy the token.<br><br>
  <strong>Your friend only needs to do the setup once</strong> — the token and repo are saved in the browser.
</div>

<script>
  let currentSha = null;
  let currentPrices = {};

  // Load saved settings
  window.onload = () => {
    const saved = JSON.parse(localStorage.getItem('gl_config') || '{}');
    if (saved.token) document.getElementById('gh-token').value = saved.token;
    if (saved.repo) document.getElementById('gh-repo').value = saved.repo;
    if (saved.file) document.getElementById('gh-file').value = saved.file;
  };

  function getConfig() {
    return {
      token: document.getElementById('gh-token').value.trim(),
      repo: document.getElementById('gh-repo').value.trim(),
      file: document.getElementById('gh-file').value.trim() || 'prices.json',
    };
  }

  function showStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'status ' + type;
    setTimeout(() => el.className = 'status', 5000);
  }

  async function loadPrices() {
    const { token, repo, file } = getConfig();
    if (!token || !repo) { showStatus('Please fill in token and repo.', 'error'); return; }

    localStorage.setItem('gl_config', JSON.stringify({ token, repo, file }));

    const btn = document.querySelector('#setup-section .save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Loading…';

    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/${file}`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
      });

      let prices = {};
      if (res.ok) {
        const data = await res.json();
        currentSha = data.sha;
        prices = JSON.parse(atob(data.content.replace(/\n/g, '')));
        currentPrices = prices;
      } else if (res.status === 404) {
        // File doesn't exist yet — start with a few examples
        currentSha = null;
        prices = {
          "Tomato": { "price": "₹45/kg", "hindi": "टोमॅटो" },
          "Spinach": { "price": "₹40/kg", "hindi": "पालक" },
          "Onion": { "price": "₹40/kg", "hindi": "कांदा" }
        };
      } else {
        throw new Error(`GitHub error: ${res.status}`);
      }

      renderPrices(prices);
      document.getElementById('setup-section').style.display = 'none';
      document.getElementById('prices-section').style.display = 'block';
      document.getElementById('publish-btn').style.display = 'block';

    } catch (e) {
      showStatus('Error: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🔓 Load Current Prices';
    }
  }

  function renderPrices(prices) {
    const container = document.getElementById('price-list');
    container.innerHTML = '';
    // Format: { "Spinach": { "price": "₹40/kg", "hindi": "पालक" }, ... }
    Object.entries(prices).forEach(([name, item]) => addRow(name, item.price || ''));
  }

  function addRow(name = '', price = '') {
    const container = document.getElementById('price-list');
    const div = document.createElement('div');
    div.className = 'price-row price-row-4';
    div.innerHTML = `
      <div>
        <label class="item-label">Item Name</label>
        <input type="text" class="item-name" value="${name}" placeholder="e.g. Tomato">
      </div>
      <div style="grid-column:span 2">
        <label class="item-label">Price (e.g. ₹45/kg or ₹20/bunch)</label>
        <input type="text" class="item-price" value="${price}" placeholder="₹45/kg">
      </div>
      <button class="remove-btn" onclick="this.closest('.price-row').remove()">✕</button>
    `;
    container.appendChild(div);
  }

  function addItem() { addRow(); }

  async function savePrices() {
    const { token, repo, file } = getConfig();
    const rows = document.querySelectorAll('.price-row');
    const prices = {};

    rows.forEach((row, i) => {
      const name = row.querySelector('.item-name').value.trim();
      const price = row.querySelector('.item-price').value.trim();
      if (name) {
        // Preserve existing hindi text if already in file, otherwise blank
        const existing = currentPrices[name] || {};
        prices[name] = { price: price || '—', hindi: existing.hindi || '' };
      }
    });

    const btn = document.getElementById('publish-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Publishing…';

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(prices, null, 2))));
    const body = {
      message: `Update prices – ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`,
      content,
      ...(currentSha ? { sha: currentSha } : {})
    };

    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/${file}`, {
        method: 'PUT',
        headers: {
          Authorization: `token ${token}`,
          Accept: 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || res.status);
      }

      const data = await res.json();
      currentSha = data.content.sha;
      showStatus('✅ Prices updated! Changes live in ~30 seconds.', 'success');

    } catch (e) {
      showStatus('❌ Failed to save: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '💾 Save & Publish Prices';
    }
  }
</script>
</body>
</html>
